<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow">
        <h2 class="text-neon text-center mb-4">Crear Cuenta</h2>
        <form>
          <div class="mb-3">
            <label class="form-label text-white">Nombre Completo</label>
            <input type="text" class="form-control bg-dark text-white border-secondary">
          </div>
          <div class="mb-3">
            <label class="form-label text-white">Email</label>
            <input type="email" class="form-control bg-dark text-white border-secondary">
          </div>
          <div class="mb-3">
            <label class="form-label text-white">Contraseña</label>
            <input type="password" class="form-control bg-dark text-white border-secondary">
          </div>
          <button type="submit" class="btn btn-neon w-100 mt-3">Registrarse</button>
          <p class="text-secondary mt-3">
            ¿Ya eres miembro? <a routerLink="/login" class="text-neon">Inicia sesión</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
