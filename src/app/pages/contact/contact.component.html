<div class="container pt-5 mt-5 pb-5" style="margin-top: 6rem !important;">

  <!-- Cabecera -->
  <div class="text-center mb-5">
    <h1 class="fw-bold mb-2">
      <span style="color: #00f3ff; text-shadow: 0 0 15px rgba(0,243,255,0.4);">CONTÁCT</span><span style="color: #bc13fe; text-shadow: 0 0 15px rgba(188,19,254,0.4);">ANOS</span>
    </h1>
    <p class="text-secondary">¿Tienes dudas? Estamos aquí para ayudarte.</p>
  </div>

  <div class="row g-5 justify-content-center">

    <!-- Formulario -->
    <div class="col-md-7">
      <div class="p-4 rounded-4" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(0,243,255,0.15);">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-secondary small">NOMBRE</label>
            <input type="text" class="form-control contact-input" placeholder="Tu nombre">
          </div>
          <div class="col-md-6">
            <label class="form-label text-secondary small">APELLIDOS</label>
            <input type="text" class="form-control contact-input" placeholder="Tus apellidos">
          </div>
          <div class="col-12">
            <label class="form-label text-secondary small">EMAIL</label>
            <input type="email" class="form-control contact-input" placeholder="tu@email.com">
          </div>
          <div class="col-12">
            <label class="form-label text-secondary small">ASUNTO</label>
            <select class="form-select contact-input">
              <option value="" disabled selected>Selecciona un asunto</option>
              <option>Información sobre cursos</option>
              <option>Problemas técnicos</option>
              <option>Pagos y facturación</option>
              <option>Colaboraciones</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label text-secondary small">MENSAJE</label>
            <textarea class="form-control contact-input" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
          </div>
          <div class="col-12 mt-2">
            <button class="btn btn-neon w-100 fw-bold py-3">
              <i class="bi bi-send me-2"></i>ENVIAR MENSAJE
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Info de contacto -->
    <div class="col-md-4">
      <div class="d-flex flex-column gap-4">

        <div class="contact-info-card">
          <div class="contact-info-icon"><i class="bi bi-envelope"></i></div>
          <div>
            <p class="text-secondary small mb-1">EMAIL</p>
            <p class="text-white mb-0">soporte&#64;pixelacademy.com</p>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="contact-info-icon"><i class="bi bi-clock"></i></div>
          <div>
            <p class="text-secondary small mb-1">HORARIO DE ATENCIÓN</p>
            <p class="text-white mb-0">Lun – Vie: 9:00 – 18:00</p>
            <p class="text-secondary small mb-0">Sáb – Dom: Cerrado</p>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="contact-info-icon"><i class="bi bi-discord"></i></div>
          <div>
            <p class="text-secondary small mb-1">COMUNIDAD</p>
            <p class="text-white mb-0">Únete a nuestro Discord</p>
            <a href="https://discord.com" target="_blank" class="small" style="color: #00f3ff;">discord.gg/pixelacademy</a>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="contact-info-icon"><i class="bi bi-geo-alt"></i></div>
          <div>
            <p class="text-secondary small mb-1">UBICACIÓN</p>
            <p class="text-white mb-0">Valencia, España</p>
            <p class="text-secondary small mb-0">100% formación online</p>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
