<div class="container mt-5 pt-5 mb-5">
  <div class="row g-5">
    <div class="col-lg-8">
      <!-- Sección de Envío -->
      <div class="card p-4 mb-4">
        <h4 class="text-neon mb-4">DATOS DE ENVÍO</h4>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="text-white small mb-2">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>
          <div class="col-md-6">
            <label class="text-white small mb-2">Email</label>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>
          <div class="col-12">
            <label class="text-white small mb-2">Dirección de facturación</label>
            <input type="text" class="form-control" placeholder="Calle, número, piso...">
          </div>
        </div>
      </div>

      <!-- Sección de Pago -->
      <div class="card p-4">
        <h4 class="text-neon mb-4">MÉTODO DE PAGO</h4>
        <div class="mb-3">
          <select class="form-select form-control">
            <option>Tarjeta de Crédito / Débito</option>
            <option>PayPal</option>
            <option>Transferencia Bancaria</option>
          </select>
        </div>
        <div class="row g-3">
          <div class="col-md-8">
            <label class="text-white small mb-2">Número de Tarjeta</label>
            <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
          </div>
          <div class="col-md-4">
            <label class="text-white small mb-2">CVC</label>
            <input type="text" class="form-control" placeholder="123">
          </div>
        </div>
      </div>
    </div>

    <!-- Resumen lateral -->
    <div class="col-lg-4">
      <div class="card p-4 shadow-lg border-neon">
        <h3 class="text-white mb-4">Resumen</h3>
        <hr class="border-secondary opacity-25">

        <div class="mb-4">
          <!-- Usamos el signal del servicio con ()[cite: 1] -->
          @for (item of cartService.getCart(); track item.id) {
            <div class="d-flex justify-content-between mb-2 small">
              <span class="text-secondary">{{ item.title }}</span>
              <span class="text-white fw-bold">{{ item.price }}€</span>
            </div>
          }
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <span class="text-white fs-5">Total:</span>
          <span class="text-neon fs-2 fw-bold">{{ cartService.totalPrice() }}€</span>
        </div>

        <button class="btn-neon w-100 py-3 fw-bold" (click)="pagar()">
          CONFIRMAR PEDIDO
        </button>
      </div>
    </div>
  </div>
</div>
