<div class="container py-5 mt-5" style="margin-top: 6rem !important;">
  <div class="row mb-5 text-center">
    <div class="col">
      <h2 class="text-white logo-text" style="letter-spacing: 2px;">
        NUESTROS <span style="color: #00f3ff;">CURSOS</span>
      </h2>
      <div style="height: 2px; width: 60px; background: #00f3ff; margin: 10px auto;"></div>
    </div>
  </div>

  <div class="row g-4">
    @if (isLoading()) {
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="col-md-6 col-lg-4">
          <div class="skeleton-card p-3">
            <div class="skeleton-img"></div>
            <div class="skeleton-text" style="width: 80%;"></div>
            <div class="skeleton-text" style="width: 60%;"></div>
            <div class="skeleton-text" style="width: 40%; margin-top: 3rem;"></div>
          </div>
        </div>
      }
    } @else {
      @for (course of courses; track course.id) {
        <div class="col-md-6 col-lg-4 d-flex align-items-stretch fade-in-up">
          <div class="cyber-card h-100 d-flex flex-column p-3 w-100">
            <div class="course-img-container">
              <img [src]="course.imagen" [alt]="course.titulo" class="w-100 h-100 image-glow">
            </div>

            <div class="card-body d-flex flex-column flex-grow-1 p-0">
              <h5 class="text-white mb-2">{{ course.titulo }}</h5>
              <div class="mb-3">
                <span class="badge" style="background: #bc13fe;">{{ course.categoria }}</span>
              </div>

              <div class="mt-auto">
                <p class="fw-bold fs-3 mb-3" style="color: #00f3ff;">{{ course.precio }}€</p>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-info w-50" [routerLink]="['/detalle-curso', course.id]">Detalles</button>
                  <button (click)="agregarAlCarrito(course)" class="btn btn-primary w-50 fw-bold">Añadir</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    }
  </div>

  @if (toast()) {
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
      <div class="toast show align-items-center text-white bg-dark border-info shadow-lg" role="alert">
        <div class="d-flex">
          <div class="toast-body">
            <i class="bi bi-cpu me-2"></i> {{ toast() }}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toast.set(null)"></button>
        </div>
      </div>
    </div>
  }
</div>
